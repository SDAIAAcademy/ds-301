<script type="application/json" id="academy-data">{"v":1,"engine":"1.0.0","build":{"at":"2026-11-15T15:57:16Z","version":"2027.1.0","commit":"5c64064"},"course":{"id":"ds-301","code":"DS-301","title":"Regression and Generalised Linear Modelling","track":"data-science","lang":"en","dir":"ltr","url":"https://sdaiaacademy.github.io/ds-301/","repo":"SDAIAAcademy/ds-301","home":"index.html","outcomes":[{"id":"LO1","text":"Implement linear models with interactions and splines and report average marginal effects with intervals, given household consumption with tariff band, household size and temperature"},{"id":"LO2","text":"Apply logistic and count models, choosing between Poisson and negative binomial from a dispersion check, given late-payment flags and weekly leak reports with pipe length as exposure"},{"id":"LO3","text":"Diagnose misfit with residuals, influence measures and simulation from the fitted model, then correct the model, given a model with five seeded problems such as overdispersion and separation"},{"id":"LO4","text":"Analyse grouped data with clustered standard errors and a random-intercept model and explain how the intervals change, given readings nested in 30 districts of very different sizes"},{"id":"LO5","text":"Apply ridge and lasso with cross-validated tuning and measure the stability of the selected predictors, given 120 correlated candidate predictors"},{"id":"LO6","text":"Build and defend a regression model for a planner's question, justifying terms, family, uncertainty and whether the use is descriptive, predictive or causal, given a supplied dataset and a written brief"}],"unit":"day","units":[{"n":1,"id":"day1","label":"Day 1","title":"Linear models that answer a question","sessions":[{"n":1,"label":"Session 1","title":"A regression answers a question"},{"n":2,"label":"Session 2","title":"Fake data first"},{"n":3,"label":"Session 3","title":"Transformations and splines"},{"n":4,"label":"Session 4","title":"Interactions and marginal effects"}]},{"n":2,"id":"day2","label":"Day 2","title":"Generalised linear models","sessions":[{"n":1,"label":"Session 1","title":"Links and families"},{"n":2,"label":"Session 2","title":"Reading a logistic model"},{"n":3,"label":"Session 3","title":"Counts and exposure"},{"n":4,"label":"Session 4","title":"Overdispersion"}]},{"n":3,"id":"day3","label":"Day 3","title":"Check and repair","sessions":[{"n":1,"label":"Session 1","title":"Residuals that tell you something"},{"n":2,"label":"Session 2","title":"Influential observations"},{"n":3,"label":"Session 3","title":"Simulation-based checks"},{"n":4,"label":"Session 4","title":"Separation and error structure"}]},{"n":4,"id":"day4","label":"Day 4","title":"Grouped data and many predictors","sessions":[{"n":1,"label":"Session 1","title":"Clustered data"},{"n":2,"label":"Session 2","title":"Partial pooling"},{"n":3,"label":"Session 3","title":"Penalised regression"},{"n":4,"label":"Session 4","title":"Reporting a model"}]},{"n":5,"id":"capstone","label":"Capstone","title":"Capstone project presentations","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-three-uses-q1","type":"single","prompt":"A vendor's late-payment model, trained on 2025 bills, ranks 2026 bills well: 80% of the late payers are in its top fifth. The vendor says sending reminders to that fifth will cut late payment. What does the evidence support?","options":[{"key":"A","text":"That reminders to the top fifth will cut late payment"},{"key":"B","text":"That the model predicts which 2026 bills will be paid late"},{"key":"C","text":"That the model's variables explain why bills are paid late"},{"key":"D","text":"Nothing, since the model was not tested in a trial"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The model was checked on bills it did not see, which supports prediction. What a reminder changes is a causal question that needs reminders to be sent, ideally at random.","misconceptions":["Reads a good ranking as proof of an effect: no reminders were sent, so nothing measured what they change","","Treats a prediction as a description of why: a ranking can work through variables that cause nothing","Assumes evidence needs a randomised trial to support any use; checked predictions support prediction"],"lo":["LO6"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-three-uses","title":"Which use does this evidence support?"},"level":null,"pool":"checkpoint"},{"id":"check-fake-data-q1","type":"single","prompt":"You simulate bills from a model with a temperature spline, fit the same model and recover every coefficient within its interval; coverage over 200 repeats is 95%. What have you shown?","options":[{"key":"A","text":"That Sahil's real bills follow a temperature spline"},{"key":"B","text":"That the temperature effect is causal"},{"key":"C","text":"That the real model's intervals will cover 95%"},{"key":"D","text":"That the code and the estimator work when the model is right"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"You planted the model, so recovering it checks the fitting machinery only. Whether real data follow it is a separate check against the data.","misconceptions":["Confuses recovering a planted model with the real data following it","Reads coverage as a property of the effect, not of the interval method","Assumes the real data share the fake data's noise; real residuals may fan out or cluster",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-fake-data","title":"What does a perfect recovery prove?"},"level":null,"pool":"checkpoint"},{"id":"check-spline-q1","type":"single","prompt":"A planner fits log consumption with a temperature spline, takes exp of each household's prediction for August and sums them to size the district's supply. The total comes out below the meters' August total. What is the most likely reason?","options":[{"key":"A","text":"exp of a log-scale prediction is a median, which sits below the mean"},{"key":"B","text":"The spline has too few degrees of freedom to fit August"},{"key":"C","text":"The interval for the mean was too narrow"},{"key":"D","text":"Log models cannot be used for volumes"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The mean of the log is below the log of the mean, so exp(prediction) underestimates the mean. Add σ²/2 before exp, or use smearing.","misconceptions":["","Blames flexibility for a bias that any log model has; the spline's residuals showed no pattern","Confuses the band, which is about uncertainty, with the level of the prediction","Assumes a log model cannot predict totals at all; it can, after the right back-transform"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-spline","title":"What did the planner's total get wrong?"},"level":null,"pool":"checkpoint"},{"id":"check-interaction-q1","type":"single","prompt":"In a model of log consumption with a band-by-size interaction, the size coefficient is 0.096 and the villa-by-size term is 0.019. Ghaliya asks how many more cubic metres a month go with one more person in villa households. What do you report?","options":[{"key":"A","text":"0.019 m³, the villa-by-size term"},{"key":"B","text":"12.1%, from the summed slope"},{"key":"C","text":"The average over villa bills of the m³ difference from one more person, with an interval"},{"key":"D","text":"The standard band's 2.3 m³, since size works the same way"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is in m³ for villa households, so the answer is computed on that scale and averaged over those bills: about 5.0 m³ (4.8 to 5.2).","misconceptions":["Reads the interaction term alone as the villa slope; it is a difference between slopes","Stops at the log scale: a percentage is not the cubic metres she asked for","","Ignores the interaction: the reference band's slope does not apply to villas"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-interaction","title":"What is the villa effect of one more person?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"A model of log monthly consumption has a size slope of 0.096 for standard households. Ghaliya asks how many more cubic metres a month go with one more person in standard households. What do you give her?","options":[{"key":"A","text":"0.096"},{"key":"B","text":"About 10% more per person"},{"key":"C","text":"The average over standard bills of the m³ difference from one more person: about 2.3 (2.3 to 2.4)"},{"key":"D","text":"exp(0.096) times the median bill"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The question names a scale (m³) and a population (standard households): compute on that scale, average over those bills, and add an interval.","misconceptions":["Gives the log-scale coefficient, which is not in cubic metres","Gives a percentage when the question asked for a volume","","Uses exp of the prediction, the median, so the volume comes out about 5% too small"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which number answers Ghaliya?"},"level":null,"pool":"checkpoint"},{"id":"check-family-q1","type":"single","prompt":"A planner wants the probability that a new connection request is approved within 10 days, from the request's district, type and completeness. About 4% of incomplete requests are approved in time. Which model do you start from?","options":[{"key":"A","text":"A logistic model of the approved-in-time flag"},{"key":"B","text":"A linear model of the approved-in-time flag"},{"key":"C","text":"A linear model of the number of days to approval"},{"key":"D","text":"A Poisson model of the approved-in-time flag"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The outcome is a flag, so the family is binomial; a rate near 4% is exactly where a straight line breaks.","misconceptions":["","Ignores that the outcome is a flag: a line can predict below 0 for incomplete requests near 4%","Changes the question: days to approval is another outcome, and the planner asked for a probability","Uses a count model for a yes-or-no outcome"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-family","title":"Which model fits the outcome?"},"level":null,"pool":"checkpoint"},{"id":"check-logistic-q1","type":"single","prompt":"The autopay odds ratio is 0.10. Without autopay, a household's predicted probability of a late bill is 5%. About how much lower is it for the same profile with autopay?","options":[{"key":"A","text":"90 percentage points"},{"key":"B","text":"25 percentage points"},{"key":"C","text":"10 percentage points"},{"key":"D","text":"About 4.5 percentage points"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Odds 0.05/0.95 = 0.053; a tenth is 0.0053, a probability of about 0.5%. From 5% to 0.5% is 4.5 points.","misconceptions":["Reads the odds ratio as a multiplier on the probability, then subtracts 90% of 100 points","Applies the average over all bills to a household near the bound","Subtracts the odds ratio from the probability as if both were on one scale",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-logistic","title":"How big is the difference for this household?"},"level":null,"pool":"checkpoint"},{"id":"check-offset-q1","type":"single","prompt":"A colleague fits leak counts on material and age with a Poisson model and no offset. Segments of asbestos cement happen to be shorter on average. What happens to the asbestos-cement coefficient?","options":[{"key":"A","text":"Nothing: a Poisson model accounts for length"},{"key":"B","text":"It compares counts, not rates, so short asbestos-cement mains look less leaky than they are"},{"key":"C","text":"Its standard error grows, but the estimate is fine"},{"key":"D","text":"Only predictions change; coefficients are unaffected"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Without the exposure, a coefficient describes counts per segment; shorter segments have fewer chances to leak, which hides a higher rate.","misconceptions":["Assumes the model adjusts for length by itself; without an offset or a length term it cannot","","Confuses exposure with dispersion: length changes the mean, not the variance-to-mean ratio","Thinks an offset only matters for prediction, not for the coefficients"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-offset","title":"What does the offset do?"},"level":null,"pool":"checkpoint"},{"id":"check-dispersion-q1","type":"single","prompt":"A Poisson model of leak counts has a Pearson dispersion of 2.3. Its rate ratio for asbestos cement is 1.62 with a 95% interval of 1.38 to 1.91. What should Basil expect from a negative binomial refit?","options":[{"key":"A","text":"A much smaller rate ratio, since the Poisson estimate is inflated"},{"key":"B","text":"The same interval, with a better AIC"},{"key":"C","text":"A similar rate ratio with an interval about one and a half times as wide"},{"key":"D","text":"No answer: counts with overdispersion need a zero-inflated model"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Both models describe the same mean; the negative binomial admits the extra variance, which widens the intervals by about the square root of the dispersion.","misconceptions":["Thinks overdispersion biases the estimate itself; it mainly understates its uncertainty","Thinks the extra parameter only changes the fit statistics","","Confuses overdispersion with excess zeros needing a different model family entirely"],"lo":["LO2","LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-dispersion","title":"What does a dispersion of 2.3 change?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"A Poisson leak model with offset log(km-years) gives asbestos cement a rate ratio of 1.62; its dispersion is 2.3. What can Basil's note say?","options":[{"key":"A","text":"Asbestos-cement mains have 1.62 more leaks a year than PVC mains"},{"key":"B","text":"Asbestos cement leaks at about 1.6 times the rate of PVC at equal age and pressure, with an interval wider than the Poisson one"},{"key":"C","text":"Replacing asbestos cement with PVC will cut leaks by 38%"},{"key":"D","text":"Nothing, because the model is overdispersed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A rate ratio compares rates per kilometre-year; with dispersion 2.3 the honest interval is about one and a half times as wide, as the negative binomial showed.","misconceptions":["Reads a rate ratio as a difference in counts","","Thinks the offset makes the comparison causal","Thinks overdispersion makes the estimate unusable rather than its interval too narrow"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which statement about the leak model is right?"},"level":null,"pool":"checkpoint"},{"id":"check-binned-q1","type":"single","prompt":"For a logistic model of meter faults, binned residuals against meter age are positive for the youngest and oldest meters and negative in between; 6 of 20 bins sit outside the band. What do you do?","options":[{"key":"A","text":"Nothing: some bins always fall outside"},{"key":"B","text":"Switch to a Poisson model of faults"},{"key":"C","text":"Use robust standard errors"},{"key":"D","text":"Give age a curved term, such as a spline, and plot the binned residuals again"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A U-shaped pattern against one predictor means its effect is not straight on the log odds scale; a flexible term for it is the repair, checked by the same plot.","misconceptions":["Thinks a 2-SE band allows many bins outside by chance; about one in 20 is expected","Reaches for a different family when the problem is the form of one predictor","Treats a pattern in the mean as a problem of the standard errors",""],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-binned","title":"What does this residual plot tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-influence-q1","type":"single","prompt":"In a model of 30 district rates, one district has leverage 0.7 and Cook's distance 1.5. Its data are correct: a new district with unusually high pressure. What goes in the report?","options":[{"key":"A","text":"Keep it, and report the estimates with and without it, saying the pressure result leans on one district"},{"key":"B","text":"Delete it as an outlier, since its Cook's distance is above 1"},{"key":"C","text":"Keep it and say nothing, since the data are correct"},{"key":"D","text":"Take the log of the leak rate so that it is no longer influential"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A real unit stays in. Because the conclusions depend on it, the reader must see both fits and the reason.","misconceptions":["","Treats high influence as proof of an error; this district's data were checked and are correct","Hides the influence instead of reporting it; a robust fit still leaves the reader unaware","Thinks a log transform removes influence that comes from the predictors' position"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-influence","title":"What do you do with this district?"},"level":null,"pool":"checkpoint"},{"id":"check-simulation-q1","type":"single","prompt":"A Poisson model of complaints per district-month will be used to staff the call centre for the busiest months. You can simulate 1,000 replicate years from it. Which statistic makes the most useful check?","options":[{"key":"A","text":"The total number of complaints in the year"},{"key":"B","text":"The mean temperature of the months"},{"key":"C","text":"The largest monthly count in any district"},{"key":"D","text":"The coefficient of temperature"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Staffing depends on the peaks, and a Poisson model with too little variance under-produces them; the total says nothing.","misconceptions":["Uses a statistic the model reproduces by construction, so the check cannot fail","Checks the predictors' distribution, which the model does not generate","","Uses the fitted coefficients themselves, which replicate exactly by definition"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-simulation","title":"Which check would reveal the problem?"},"level":null,"pool":"checkpoint"},{"id":"check-separation-q1","type":"single","prompt":"A logistic model of whether a customer cancels includes \"closing letter printed\". Its coefficient is 31 with a standard error of 9,000, and the model's AIC is far better than without it. What is the likely explanation?","options":[{"key":"A","text":"The letter is by far the strongest driver of cancelling"},{"key":"B","text":"The letter is printed only for customers who cancel, so it separates the outcome and must be removed"},{"key":"C","text":"The sample is too small; collect more months"},{"key":"D","text":"Use HC3 standard errors and keep the term"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A huge coefficient with a huge standard error points to separation; a flag created by the outcome is leakage as well, so no estimation method rescues it.","misconceptions":["Reads a runaway coefficient as a very strong real effect","","Treats a structural problem as a sampling one that more data would solve","Uses robust errors for a problem of the estimate itself"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-separation","title":"What explains this fit?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"A colleague's logistic model of meter faults is ready for review. Which entry would an assessor accept?","options":[{"key":"A","text":"The residuals looked a bit off, so I added a log term"},{"key":"B","text":"No problems: the model converged without warnings"},{"key":"C","text":"Missing curve: 6 of 20 binned residuals against meter age outside the 2-SE band; with a spline in age, 1 of 20"},{"key":"D","text":"AIC fell by 40, so the model is right"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A log line names the problem, the evidence with its number, and the fix with the evidence that it worked.","misconceptions":["Names a feeling, not evidence; nobody can check it","Treats convergence as a check of the model","","Uses a fit statistic alone, which says nothing about where the model fails"],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which line belongs in a diagnosis log?"},"level":null,"pool":"checkpoint"},{"id":"check-cluster-q1","type":"single","prompt":"A model of 50,000 students' scores in 80 schools has two predictors: hours of homework (per student) and a new curriculum (per school). You switch to errors clustered by school. What happens?","options":[{"key":"A","text":"Both coefficients change, and both intervals widen"},{"key":"B","text":"The curriculum's interval widens far more than homework's, and neither estimate changes"},{"key":"C","text":"Homework's interval widens most, because it has more variation"},{"key":"D","text":"Nothing much: with 50,000 students clustering does not matter"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The curriculum varies only between 80 schools, so its evidence is 80 schools; homework is compared within every school.","misconceptions":["Thinks clustering changes estimates rather than standard errors","","Has the direction backwards: the school-level term has fewer independent units","Thinks a large sample makes clustering irrelevant"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-cluster","title":"Which interval widens most?"},"level":null,"pool":"checkpoint"},{"id":"check-pooling-q1","type":"single","prompt":"In a random-intercept model, district A has 50 bills and a raw mean 0.12 above average; district B has 5,000 bills and the same raw mean. What do their estimated levels look like?","options":[{"key":"A","text":"Both shrink by the same share, as their raw means are equal"},{"key":"B","text":"B shrinks more, because it has more bills to average"},{"key":"C","text":"Neither moves: each district keeps its own mean"},{"key":"D","text":"A moves noticeably towards the average; B stays almost at 0.12"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The shrinkage factor τ²/(τ² + σ²/n) is close to 1 for large n; a mean from 50 bills is less reliable, so it borrows more from the other districts.","misconceptions":["Thinks shrinkage depends on the size of the deviation, not on how much data supports it","Has the direction of shrinkage backwards","Confuses partial pooling with no pooling",""],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-pooling","title":"Which district moves most?"},"level":null,"pool":"checkpoint"},{"id":"check-lasso-q1","type":"single","prompt":"A lasso with a cross-validated penalty selected 25 of 90 predictors. Over 100 bootstrap samples, 6 are selected every time and 40 are selected between 20% and 80% of the time. What can you say?","options":[{"key":"A","text":"The 25 selected predictors are the drivers of demand"},{"key":"B","text":"The 6 are a stable core; the others' selection depends on the sample and should not be reported as findings"},{"key":"C","text":"The model is useless and should be dropped"},{"key":"D","text":"Lower the penalty until all 40 are always selected"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Selection is itself uncertain; only what survives resampling is a stable choice, and even that is a predictive, not a causal, statement.","misconceptions":["Treats one fit's selection as a stable finding","","Thinks unstable selection makes the predictions useless","Thinks a smaller penalty fixes instability, when it only selects more"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-lasso","title":"What do you tell the planner?"},"level":null,"pool":"checkpoint"},{"id":"check-report-q1","type":"single","prompt":"Households with a smart meter display used less water than comparable households without one. They asked for the displays themselves. Which sentence fits the report?","options":[{"key":"A","text":"Installing displays will cut demand across Sahil"},{"key":"B","text":"The display coefficient is −0.07 on the log scale"},{"key":"C","text":"Households with a display used about 7% less than comparable ones (with its interval); they chose it, so this is not the effect of installing one"},{"key":"D","text":"Displays save water"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The sentence is descriptive, in the reader's terms, with its uncertainty and its limit stated.","misconceptions":["Turns an observational comparison into a causal promise","Reports a log-scale coefficient the reader cannot use","","Drops the uncertainty and the comparison it rests on"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-report","title":"Which sentence can go in the report?"},"level":null,"pool":"checkpoint"},{"id":"q-uses-01","type":"single","prompt":"A city report fits monthly consumption on tariff band, household size and temperature for all billed households and writes: \"The social tariff makes families use 9% less water.\" Which sentence does the analysis support?","options":[{"key":"A","text":"Households on the social tariff used about 9% less water than comparable households on other tariffs in the data"},{"key":"B","text":"Moving a family to the social tariff would cut its use by about 9%"},{"key":"C","text":"The social tariff caused a 9% saving once size and temperature were controlled"},{"key":"D","text":"Nothing, because regression on observational data supports no statement"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The data compare different households, so they support a description of the difference between groups, not a claim about what the tariff does.","misconceptions":["","Reads a comparison between groups of households as the effect of changing one household's tariff","Believes that adjusting for some variables turns a comparison into a causal estimate","Treats descriptive use as worthless: a stated comparison in a stated population is a valid result"],"lo":["LO6"],"day":1,"session":1,"slide":{"deck":"day1","id":"one-coefficient-three-readings","title":"A coefficient means what the question and the design let it mean"},"level":"analyze","pool":"practice"},{"id":"q-uses-02","type":"single","prompt":"Ghaliya asks: \"How much more water does a household with one more person use, in our villa districts?\" Which is the estimand?","options":[{"key":"A","text":"The coefficient of household size in a model of log consumption"},{"key":"B","text":"The R squared of a model that includes household size"},{"key":"C","text":"The average difference in monthly cubic metres between villa households and the same households with one more person"},{"key":"D","text":"The p-value of household size in a model fitted to all bands"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"An estimand names the population, the outcome with its unit and the comparison; a coefficient, a fit statistic or a p-value is a property of a model, not the quantity asked about.","misconceptions":["Confuses a model's coefficient, on its own scale, with the quantity the question asks for","Takes a measure of fit for an answer to a question about size","","Takes a test statistic for the quantity of interest and ignores the population named"],"lo":["LO6"],"day":1,"session":1,"slide":{"deck":"day1","id":"estimand-first","title":"Write the estimand first: the quantity, in whom, compared with what"},"level":"apply","pool":"practice"},{"id":"q-fake-01","type":"single","prompt":"You simulate 200 data sets from a known model, fit each, and find that 81% of the 95% intervals for one coefficient contain its planted value. What does that tell you?","options":[{"key":"A","text":"The planted value is probably wrong"},{"key":"B","text":"The intervals are too narrow for this design, so the standard errors or the model are wrong for it"},{"key":"C","text":"The estimates are biased, so the model should be refitted on real data"},{"key":"D","text":"Nothing: 81% is within the normal noise of 200 repeats"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With 200 repeats, coverage of a correct 95% interval falls between about 92% and 98%; 81% means the intervals understate the uncertainty.","misconceptions":["Forgets that in fake data the planted value is known exactly","","Confuses under-coverage with bias: intervals can miss because they are too narrow around unbiased estimates","Overestimates the simulation noise of a coverage count over 200 repeats"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"coverage","title":"Over 200 fake data sets, 94% of the intervals hold the planted value"},"level":"analyze","pool":"practice"},{"id":"q-fake-02","type":"tf","prompt":"A model that recovers every planted coefficient from fake data has been shown to describe the real bills well.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Recovering a planted model checks the code and the estimator; whether the real data follow the model is checked against the data.","misconceptions":["Confuses a test of the method with a test of the model against the world",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"fake-data-limits","title":"Fake data test the method, never the world"},"level":"understand","pool":"practice"},{"id":"q-spline-01","type":"single","prompt":"A model of log monthly consumption has a residual standard deviation of 0.30. For one household type it predicts 3.00 on the log scale. What is the best estimate of that type's mean consumption?","options":[{"key":"A","text":"exp(3.00), about 20.1 cubic metres"},{"key":"B","text":"exp(3.30), about 27.1 cubic metres"},{"key":"C","text":"3.00 cubic metres"},{"key":"D","text":"exp(3.045), about 21.0 cubic metres"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With normal errors on the log scale the mean is exp(prediction + sigma squared / 2) = exp(3.00 + 0.045).","misconceptions":["Takes the median, exp(prediction), for the mean","Adds sigma instead of sigma squared over two","Forgets to back-transform from the log scale",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"median-vs-mean","title":"exp(prediction) is the median; the mean is about 5% higher"},"level":"apply","pool":"practice"},{"id":"q-spline-02","type":"single","prompt":"A spline fit on 40,000 bills gives a 95% band of 37.3 to 38.4 cubic metres at 40 °C for four-person standard households. A customer of that type disputes a bill of 46 cubic metres. What does the band say about the bill?","options":[{"key":"A","text":"Nothing direct: the band is for the mean of such households, and single bills spread far wider"},{"key":"B","text":"The bill is almost certainly a meter error, since it lies outside the band"},{"key":"C","text":"The bill should be cut to 38.4 cubic metres"},{"key":"D","text":"The model is wrong, since a real bill falls outside its band"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval for the mean narrows as data grow; an interval for one household includes the household-to-household spread and is many times wider.","misconceptions":["","Reads an interval for the mean as the range of single bills","Uses the mean band as a ceiling for an individual bill","Expects individual observations to fall inside an interval for the mean"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"band-is-for-mean","title":"The band is for the mean, not for one household"},"level":"understand","pool":"practice"},{"id":"q-ame-01","type":"single","prompt":"In log_m3 ~ tariff_band * household_size, the household_size coefficient is 0.096 and tariff_band[T.social]:household_size is -0.022. What is the social band's slope for household size on the log scale?","options":[{"key":"A","text":"-0.022"},{"key":"B","text":"0.096"},{"key":"C","text":"0.074"},{"key":"D","text":"0.118"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The reference band's slope plus the social interaction term: 0.096 - 0.022 = 0.074, about 7.7% per person.","misconceptions":["Reads the interaction term as the band's slope; it is a difference between slopes","Ignores the interaction and applies the reference band's slope","","Adds the size of the interaction instead of its signed value"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"interaction-meaning","title":"An interaction gives each band its own slope for household size"},"level":"apply","pool":"practice"},{"id":"q-ame-02","type":"single","prompt":"On the log scale, one more person goes with 7.6% more consumption on the social band and 12.1% more on the villa band. In cubic metres a month, the villa effect turns out more than three times the social one. Why?","options":[{"key":"A","text":"The percentages were computed wrongly"},{"key":"B","text":"The interval for villas is wider"},{"key":"C","text":"Villas have fewer households in the data"},{"key":"D","text":"The same percentage applies to a higher base: villas use far more water to begin with"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An effect in cubic metres is the percentage times each household's level, so a larger base turns similar percentages into much larger volumes.","misconceptions":["Assumes the two scales must agree in ratio","Confuses the width of an interval with the size of an effect","Confuses the number of rows with the size of an effect",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"percent-not-answer","title":"A percentage per person is not what Ghaliya asked"},"level":"analyze","pool":"practice"},{"id":"q-family-01","type":"single","prompt":"For each district and month, a utility records the number of meter faults and the number of meters installed. Which model fits the question \"how does the fault rate differ by meter age?\"","options":[{"key":"A","text":"A linear model of the number of faults"},{"key":"B","text":"A logistic model of whether the district had any fault"},{"key":"C","text":"A Poisson or negative binomial model of faults with log meters as an offset"},{"key":"D","text":"A linear model of faults divided by meters, without weights"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The outcome is a count with an exposure (meters), so a count model with log exposure as an offset describes the rate per meter.","misconceptions":["Treats a count as a continuous outcome, which allows negative predictions and ignores exposure","Throws away the counts by reducing them to a flag","","Divides by exposure but treats a rate from 10 meters as exactly as reliable as one from 10,000"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"family-from-outcome","title":"The outcome chooses the family; the link connects its mean to a straight line"},"level":"apply","pool":"practice"},{"id":"q-family-02","type":"tf","prompt":"A linear probability model can predict a negative probability for some households even when it fits the average difference well.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A line subtracts the same amount from every row, so rows that start near zero are pushed below it; the average difference can still be right.","misconceptions":["","Believes that a model which gets the average right must get every prediction into range"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"lpm-breaks","title":"The straight line gives 4,369 bills a negative chance of being late"},"level":"understand","pool":"practice"},{"id":"q-logit-01","type":"single","prompt":"In a logistic model of late payment, the odds ratio for each past late payment is 1.6. A household has a 20% probability of a late bill. About what is the probability for the same household with one more past late payment?","options":[{"key":"A","text":"32%"},{"key":"B","text":"21.6%"},{"key":"C","text":"36%"},{"key":"D","text":"29%"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Odds 0.2/0.8 = 0.25; times 1.6 is 0.40; a probability of 0.40/1.40, about 29%.","misconceptions":["Multiplies the probability by the odds ratio","Adds the odds ratio's excess as percentage points","Adds 16 points as if the odds ratio were a difference on the probability scale",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"odds-ratios","title":"exp(coefficient) is an odds ratio: exact, and hard to use"},"level":"apply","pool":"practice"},{"id":"q-logit-02","type":"single","prompt":"Bills on autopay were late 40 points less often than comparable bills without it, in a logistic model of observational data. Which sentence may go in the collections report?","options":[{"key":"A","text":"Comparable households on autopay paid late about 40 points less often than those without it"},{"key":"B","text":"Enrolling households in autopay will cut their late payment by 40 points"},{"key":"C","text":"Autopay reduces late payment by 90%, as its odds ratio is 0.1"},{"key":"D","text":"Autopay causes on-time payment for most households"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Households chose autopay, so the data support a comparison of households, not a statement of what enrolling them would do.","misconceptions":["","Reads a comparison of self-selected groups as the effect of an action","Reads an odds ratio as a cut in probability and adds a causal claim","Turns an association into a causal claim about most households"],"lo":["LO2","LO6"],"day":2,"session":2,"slide":{"deck":"day2","id":"chose-autopay","title":"Households chose autopay, so the difference describes them, not what promoting it would do"},"level":"evaluate","pool":"practice"},{"id":"q-count-01","type":"single","prompt":"In a Poisson model of leaks with offset log(kilometre-years), the coefficient of pressure is 0.28. What does exp(0.28) = 1.32 mean?","options":[{"key":"A","text":"Each extra bar goes with 1.32 more leaks a year on every main"},{"key":"B","text":"Each extra bar goes with 32% more leaks per kilometre-year, other terms equal"},{"key":"C","text":"Each extra bar adds 0.28 leaks per kilometre"},{"key":"D","text":"A main at high pressure is 1.32 kilometres longer on average"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With a log link and an exposure offset, exp(coefficient) is a rate ratio per kilometre-year.","misconceptions":["Reads a rate ratio as a difference in counts","","Reads the log-scale coefficient as a difference in rate","Confuses the offset with an outcome"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"offset","title":"The offset puts log exposure in the model with its coefficient fixed at 1"},"level":"understand","pool":"practice"},{"id":"q-count-02","type":"single","prompt":"A Poisson model of complaints per district-month has a Pearson dispersion of 4.0. A colleague reports a rate ratio for pressure management of 1.40 with a 95% interval of 1.20 to 1.63. What do you tell them?","options":[{"key":"A","text":"The interval is about right, since dispersion affects only the fit"},{"key":"B","text":"The estimate is biased upward by a factor of 4"},{"key":"C","text":"Use a linear model instead, because counts with dispersion are not Poisson"},{"key":"D","text":"The interval is too narrow; refit with a negative binomial or scale the errors, which roughly doubles its width on the log scale"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With dispersion 4, standard errors are too small by about the square root of 4, so the log-scale interval should be about twice as wide.","misconceptions":["Believes overdispersion leaves the uncertainty unchanged","Thinks overdispersion biases the rate ratio by the dispersion factor","Abandons the count family instead of widening the variance",""],"lo":["LO2","LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"mean-variance","title":"In every group the variance is above the mean; overall about 2.3 times"},"level":"analyze","pool":"practice"},{"id":"q-binned-01","type":"single","prompt":"You plot the raw residuals of a logistic model of late payment against the bill and see two curved bands. What does this tell you about the model?","options":[{"key":"A","text":"The model needs a quadratic term in the bill"},{"key":"B","text":"Nothing yet: raw residuals of a yes-or-no outcome always form two bands, so bin and average them first"},{"key":"C","text":"The model is overdispersed"},{"key":"D","text":"The bill should be removed from the model"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each residual is either 1 - p or -p, so two bands appear for any model; only averages of residuals within bins carry information about the fit.","misconceptions":["Reads the shape forced by a binary outcome as a missing curve","","Borrows a count-model diagnosis for a binary outcome","Treats a plotting artefact as evidence against a predictor"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"raw-residuals","title":"Raw residuals of a yes-or-no model make two bands, whatever the model"},"level":"understand","pool":"practice"},{"id":"q-binned-02","type":"single","prompt":"Binned residuals of a logistic model by fitted probability show 1 of 20 bins outside the band. Against tenure in months, 6 of 20 bins sit outside, all negative for the shortest tenures. What do you conclude?","options":[{"key":"A","text":"The model fits, since the plot by fitted probability is the standard check"},{"key":"B","text":"The model is fine, since 6 of 20 is within what chance gives"},{"key":"C","text":"Tenure's effect is not straight on the log odds scale; try a curved term for it and check again"},{"key":"D","text":"Remove tenure because its residuals are biased"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Binning by fitted probability mixes all predictors and can average away a misfit in one; 6 of 20 outside against tenure, with a pattern, points to the form of tenure.","misconceptions":["Trusts the plot that mixes predictors over the one that isolates the problem","Expects many bins outside by chance, when about one in 20 is typical","","Drops a predictor instead of fixing its form"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"per-predictor","title":"Plot against each predictor; the fitted probability alone can hide the problem"},"level":"analyze","pool":"practice"},{"id":"q-influence-01","type":"single","prompt":"In a regression on 30 districts, district A has leverage 0.70 and a small residual; district B has leverage 0.08 and a residual five times larger than any other. Which statement is right?","options":[{"key":"A","text":"A is unusual in its predictors, B in its outcome; either can move the fit, which Cook's distance measures"},{"key":"B","text":"Only B can be influential, because influence comes from residuals"},{"key":"C","text":"Only A can be influential, because influence comes from leverage"},{"key":"D","text":"Both should be deleted before refitting"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Leverage measures how far a unit's predictors are from the rest; influence, as in Cook's distance, combines leverage with the size of the residual.","misconceptions":["","Ignores the role of leverage in influence","Ignores the role of the residual in influence","Treats flags as rules for deletion"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"leverage-cooks","title":"Leverage is how unusual the predictors are; Cook's distance is how much the fit moves"},"level":"understand","pool":"practice"},{"id":"q-influence-02","type":"single","prompt":"Two districts with very high Cook's distance turn out to have their main lengths keyed in tens of kilometres. A third influential district is a real new development. What is the right repair?","options":[{"key":"A","text":"Delete all three and report the fit on 27 districts"},{"key":"B","text":"Keep all three as they are, since deleting data is never allowed"},{"key":"C","text":"Correct the two lengths from the source table, keep the new district, and report the fit with and without it"},{"key":"D","text":"Replace the outcome with its logarithm so that none is influential"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Errors are corrected from the source; real units stay, and when a conclusion leans on one of them the reader sees both fits.","misconceptions":["Removes a real unit together with errors it should have corrected","Leaves known errors in the data","","Expects a transformation to remove an influence that comes from wrong data and unusual predictors"],"lo":["LO3","LO6"],"day":3,"session":2,"slide":{"deck":"day3","id":"dont-just-drop","title":"Without the three, the age slope turns positive; but first ask what each district is"},"level":"evaluate","pool":"practice"},{"id":"q-ppc-01","type":"single","prompt":"You simulate 1,000 replicate years from a Poisson model of leaks per segment and compare them with the observed year. Which comparison can reveal a problem with the model?","options":[{"key":"A","text":"The total number of leaks"},{"key":"B","text":"The mean of the fitted rates"},{"key":"C","text":"The share of segments with no leak"},{"key":"D","text":"The coefficient of pipe age"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A Poisson model with an intercept reproduces the total by construction; the share of zeros depends on the variation between segments, which the model may get wrong.","misconceptions":["Uses a statistic the model matches by construction","Compares the model with itself rather than with the data","","Uses a fitted parameter, which replicates do not test"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"choose-statistic","title":"Choose a statistic the model was not fitted to match"},"level":"apply","pool":"practice"},{"id":"q-separation-01","type":"single","prompt":"A logistic model gives a flag a coefficient of 25 with a standard error of 5,000. A cross-table shows that every row with the flag has the outcome. The flag is recorded before the outcome and is legitimate. What do you do?","options":[{"key":"A","text":"Report an odds ratio of exp(25)"},{"key":"B","text":"Use a penalised fit, such as Firth's method or a small ridge penalty, and say so"},{"key":"C","text":"Use HC3 standard errors"},{"key":"D","text":"Remove the rows with the flag"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The coefficient runs away because of separation; for a legitimate predictor a penalty gives a finite, honest estimate. A flag created by the outcome would instead be removed.","misconceptions":["Reports a runaway estimate as a finding","","Uses robust errors for a problem of the estimate itself","Throws away the rows that carry the information"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"separation-table","title":"Every one of the 2,622 bills with a notice was late: the notice follows the outcome"},"level":"analyze","pool":"practice"},{"id":"q-hc-01","type":"tf","prompt":"Switching a linear model from classical to HC3 standard errors changes its coefficients as well as their standard errors.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Robust errors change only the estimated uncertainty; the least-squares estimates stay the same.","misconceptions":["Thinks a robust variance estimate refits the model",""],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"hc3","title":"Heteroskedasticity-consistent errors change the uncertainty, not the estimates"},"level":"understand","pool":"practice"},{"id":"q-cluster-01","type":"single","prompt":"A model of 60,000 hospital visits in 40 hospitals includes the patient's age and whether the hospital has a new triage system. Which coefficient's standard error is most understated if visits are treated as independent?","options":[{"key":"A","text":"Patient age, because it varies most"},{"key":"B","text":"The triage system, because it varies only between the 40 hospitals"},{"key":"C","text":"Both equally, because all visits in a hospital are correlated"},{"key":"D","text":"Neither, because 60,000 visits is a large sample"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A hospital-level predictor draws its evidence from 40 hospitals; patient age is compared within every hospital, where the hospital's shared level cancels.","misconceptions":["Links the size of the error to the predictor's spread rather than to the level at which it varies","","Assumes clustering inflates every standard error by the same factor","Counts rows instead of independent units"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"unit-of-variation","title":"Ask first where each predictor varies: within districts or only between them"},"level":"understand","pool":"practice"},{"id":"q-cluster-02","type":"single","prompt":"You refit a consumption model with standard errors clustered by district. The programme coefficient was −0.081 with a naive standard error of 0.003. What do you expect?","options":[{"key":"A","text":"A coefficient different from −0.081 and a standard error near 0.003"},{"key":"B","text":"The same coefficient and the same standard error, since clustering only matters for small samples"},{"key":"C","text":"The same coefficient, −0.081, with a much larger standard error"},{"key":"D","text":"A smaller coefficient, because clustering removes district effects"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Clustered standard errors change only the estimated uncertainty; for a district-level predictor they grow because the evidence is the districts.","misconceptions":["Thinks clustering refits the model","Counts rows instead of independent units","","Confuses clustered errors with district fixed effects"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"clustered-se","title":"Clustered errors let residuals within a district be correlated in any way"},"level":"apply","pool":"practice"},{"id":"q-pool-01","type":"single","prompt":"A random-intercept model reports a district SD of 0.08 and a residual SD of 0.30 on the log scale. About what share of the variance lies between districts?","options":[{"key":"A","text":"27%"},{"key":"B","text":"8%"},{"key":"C","text":"About 7%"},{"key":"D","text":"0.3%"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"0.08² / (0.08² + 0.30²) = 0.0064 / 0.0964, about 7%.","misconceptions":["Divides the SDs instead of the variances","Reads the district SD as the share","","Multiplies the variances instead of dividing"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"variances","title":"Only 6% of the variance is between districts, and it still changes everything for the programme"},"level":"understand","pool":"practice"},{"id":"q-pool-02","type":"single","prompt":"In a random-intercept model, a district with 30 bills has a raw mean far above average; its estimated level is about two thirds of that distance from the average. A colleague says the model is \"hiding a problem district\". What do you answer?","options":[{"key":"A","text":"The colleague is right; use the raw mean for that district"},{"key":"B","text":"The shrinkage reflects how little 30 bills say about the district; its estimate borrows strength from the other districts, and more data would move it back if the difference is real"},{"key":"C","text":"The district should be removed as an outlier"},{"key":"D","text":"The model should use a larger district SD so that nothing shrinks"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Shrinkage is weighted by how reliable each district's own mean is; it is a better estimate of the district's level, not a cover-up.","misconceptions":["Trusts a noisy mean over a pooled estimate","","Treats a small district as an outlier","Wants to choose the variance to get a preferred answer"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"shrinkage","title":"Small districts move towards the average; large ones stay where their data put them"},"level":"analyze","pool":"practice"},{"id":"q-pool-03","type":"tf","prompt":"Clustered standard errors and a random-intercept model can both give honest uncertainty for a district-level predictor, but only the random-intercept model also estimates each district's level.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Clustering corrects the standard errors of the same estimates; the mixed model estimates a level for each district as well.","misconceptions":["","Believes the two methods answer the same questions"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"which-to-use","title":"Clustered errors fix the uncertainty; a mixed model also estimates the districts"},"level":"understand","pool":"practice"},{"id":"q-lasso-01","type":"single","prompt":"Before fitting a lasso to forecast summer water demand, you see that the export includes household members' health conditions, which the lasso might find predictive. What do you do?","options":[{"key":"A","text":"Keep the column and let the lasso decide whether it is useful"},{"key":"B","text":"Keep it only if cross-validation shows it improves the forecast"},{"key":"C","text":"Remove it before modelling, because the purpose does not justify processing health data"},{"key":"D","text":"Keep it but do not report its coefficient"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Data minimisation is decided by the purpose of the processing, not by predictive power; health data is sensitive and not needed for a supply forecast.","misconceptions":["Delegates a legal and ethical decision to a penalty","Uses predictive gain to justify processing","","Thinks hiding a coefficient makes using the data acceptable"],"lo":["LO5","LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"minimisation","title":"Remove what the purpose cannot justify, before you check whether it predicts"},"level":"apply","pool":"practice"},{"id":"q-lasso-02","type":"single","prompt":"Which statement about ridge and lasso with standardised predictors is right?","options":[{"key":"A","text":"Ridge sets some coefficients to zero; the lasso shrinks all of them"},{"key":"B","text":"The lasso can set coefficients exactly to zero; ridge shrinks them all but keeps every one"},{"key":"C","text":"Both select the true predictors when the penalty is chosen by cross-validation"},{"key":"D","text":"Neither needs the predictors to be standardised"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The absolute-value penalty of the lasso produces exact zeros; the squared penalty of ridge does not.","misconceptions":["Swaps the two penalties","","Thinks a penalty tuned for prediction recovers the true model","Forgets that one penalty treats predictors on different scales unequally"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"lasso","title":"The lasso sets coefficients to zero: one fit selects 27 of 120 predictors"},"level":"understand","pool":"practice"},{"id":"q-lasso-03","type":"single","prompt":"A lasso selects October consumption in 60% of 100 bootstrap samples. October is correlated at 0.9 with September and November, which are selected 45% and 50% of the time. What should the report say?","options":[{"key":"A","text":"October consumption is a key driver of demand"},{"key":"B","text":"September and November should be removed so October is always selected"},{"key":"C","text":"The autumn months carry similar information and the lasso picks among them unstably; none is reported as a finding"},{"key":"D","text":"October is significant at the 60% level"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With correlated predictors the lasso's choice within the group depends on the sample; a selection frequency well below 100% is not a finding.","misconceptions":["Treats one selection as a stable result","Manipulates the candidate set to force a preferred selection","","Reads a selection frequency as a significance level"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"selection","title":"Over 100 bootstrap samples, eight predictors are selected every time; the rest come and go"},"level":"evaluate","pool":"practice"},{"id":"q-report-01","type":"single","prompt":"A log-consumption model gives programme districts a coefficient of −0.109 with a 95% interval of −0.167 to −0.051. How should the planning report state it?","options":[{"key":"A","text":"Programme districts: −0.109 (−0.167 to −0.051)"},{"key":"B","text":"Programme districts used 10.9% less water, which the programme saved"},{"key":"C","text":"Households in programme districts used about 10% less (5% to 15% less) than comparable households elsewhere"},{"key":"D","text":"The programme reduces consumption by 0.109 m³"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"exp(−0.109) − 1 is about −10%, and the interval converts the same way; the sentence keeps the comparison descriptive.","misconceptions":["Leaves the reader a log-scale coefficient","Reads a log coefficient as a percentage directly and adds a causal claim","","Reads a log-scale coefficient as cubic metres"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"readers-units","title":"Write m³ and percentages, never coefficients on a log scale"},"level":"apply","pool":"practice"},{"id":"q-capstone-01","type":"single","prompt":"In a capstone defence the assessor removes the household-size-by-band interaction from a log-consumption model. Before re-running, what should you predict for the average effect of an extra person?","options":[{"key":"A","text":"Every band gets the same percentage effect, so the villa effect in m³ shrinks and the social effect grows towards the average"},{"key":"B","text":"Nothing changes, since an interaction only affects the standard errors"},{"key":"C","text":"All effects become zero, because the interaction carried the size effect"},{"key":"D","text":"The model can no longer be fitted"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Without the interaction one slope on the log scale is shared by every band; the per-band effects in m³ move towards each other, though villas still gain more m³ because they start higher.","misconceptions":["","Thinks interactions change uncertainty but not estimates","Confuses removing an interaction with removing the main effect","Thinks a simpler model cannot be estimated"],"lo":["LO6"],"day":5,"session":null,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-capstone-02","type":"single","prompt":"For brief C1, complaints per district-month, a participant fits a Poisson model without an offset. Customers per district range from 40 to 9,000. What does the assessor expect them to fix first?","options":[{"key":"A","text":"Add log(customers) as an offset so the model describes complaints per customer"},{"key":"B","text":"Switch to a linear model of complaints"},{"key":"C","text":"Drop the smallest districts"},{"key":"D","text":"Use HC3 standard errors"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Without an exposure, large districts have more complaints simply because they have more customers; the offset turns the model into one for the rate.","misconceptions":["","Abandons the count family instead of adding the exposure","Removes data instead of modelling exposure","Fixes the standard errors of a model whose estimates are wrong"],"lo":["LO6","LO2"],"day":5,"session":null,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-capstone-03","type":"single","prompt":"For brief C2, where the channel of the offer was chosen at random, which statement can the report make?","options":[{"key":"A","text":"Text messages are associated with uptake, but nothing causal can be said from data"},{"key":"B","text":"Sending a text message instead of a letter changed the share taking the kit by the estimated difference, with its interval"},{"key":"C","text":"Text messages work better for every household"},{"key":"D","text":"The difference is causal only if the model includes every household characteristic"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Random assignment makes the groups comparable, so the difference between channels estimates the effect of the channel for these households.","misconceptions":["Applies the caution of observational data to a randomised comparison","","Turns an average effect into a claim about every household","Thinks adjustment, not randomisation, is what licenses a causal claim"],"lo":["LO6"],"day":5,"session":null,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-capstone-04","type":"tf","prompt":"A capstone repository whose notebook gives the README's numbers only on the participant's own laptop meets the reproducibility criterion.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Reproducibility means a fresh clone reruns from the raw data with a fixed seed to the same numbers.","misconceptions":["Equates running once with being reproducible",""],"lo":["LO6"],"day":5,"session":null,"slide":null,"level":"understand","pool":"practice"}]}</script>
