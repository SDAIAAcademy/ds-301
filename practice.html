<section>
<h2>Day 1: Linear models that answer a question</h2>
<ol>
<li><p>A vendor's late-payment model, trained on 2025 bills, ranks 2026 bills well: 80% of the late payers are in its top fifth. The vendor says sending reminders to that fifth will cut late payment. What does the evidence support?</p><ul><li><b>A.</b> That reminders to the top fifth will cut late payment</li><li><b>B.</b> That the model predicts which 2026 bills will be paid late</li><li><b>C.</b> That the model's variables explain why bills are paid late</li><li><b>D.</b> Nothing, since the model was not tested in a trial</li></ul></li>
<li><p>You simulate bills from a model with a temperature spline, fit the same model and recover every coefficient within its interval; coverage over 200 repeats is 95%. What have you shown?</p><ul><li><b>A.</b> That Sahil's real bills follow a temperature spline</li><li><b>B.</b> That the temperature effect is causal</li><li><b>C.</b> That the real model's intervals will cover 95%</li><li><b>D.</b> That the code and the estimator work when the model is right</li></ul></li>
<li><p>A planner fits log consumption with a temperature spline, takes exp of each household's prediction for August and sums them to size the district's supply. The total comes out below the meters' August total. What is the most likely reason?</p><ul><li><b>A.</b> exp of a log-scale prediction is a median, which sits below the mean</li><li><b>B.</b> The spline has too few degrees of freedom to fit August</li><li><b>C.</b> The interval for the mean was too narrow</li><li><b>D.</b> Log models cannot be used for volumes</li></ul></li>
<li><p>In a model of log consumption with a band-by-size interaction, the size coefficient is 0.096 and the villa-by-size term is 0.019. Ghaliya asks how many more cubic metres a month go with one more person in villa households. What do you report?</p><ul><li><b>A.</b> 0.019 m³, the villa-by-size term</li><li><b>B.</b> 12.1%, from the summed slope</li><li><b>C.</b> The average over villa bills of the m³ difference from one more person, with an interval</li><li><b>D.</b> The standard band's 2.3 m³, since size works the same way</li></ul></li>
<li><p>A city report fits monthly consumption on tariff band, household size and temperature for all billed households and writes: "The social tariff makes families use 9% less water." Which sentence does the analysis support?</p><ul><li><b>A.</b> Households on the social tariff used about 9% less water than comparable households on other tariffs in the data</li><li><b>B.</b> Moving a family to the social tariff would cut its use by about 9%</li><li><b>C.</b> The social tariff caused a 9% saving once size and temperature were controlled</li><li><b>D.</b> Nothing, because regression on observational data supports no statement</li></ul></li>
<li><p>Ghaliya asks: "How much more water does a household with one more person use, in our villa districts?" Which is the estimand?</p><ul><li><b>A.</b> The coefficient of household size in a model of log consumption</li><li><b>B.</b> The R squared of a model that includes household size</li><li><b>C.</b> The average difference in monthly cubic metres between villa households and the same households with one more person</li><li><b>D.</b> The p-value of household size in a model fitted to all bands</li></ul></li>
<li><p>You simulate 200 data sets from a known model, fit each, and find that 81% of the 95% intervals for one coefficient contain its planted value. What does that tell you?</p><ul><li><b>A.</b> The planted value is probably wrong</li><li><b>B.</b> The intervals are too narrow for this design, so the standard errors or the model are wrong for it</li><li><b>C.</b> The estimates are biased, so the model should be refitted on real data</li><li><b>D.</b> Nothing: 81% is within the normal noise of 200 repeats</li></ul></li>
<li><p>A model that recovers every planted coefficient from fake data has been shown to describe the real bills well.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A model of log monthly consumption has a residual standard deviation of 0.30. For one household type it predicts 3.00 on the log scale. What is the best estimate of that type's mean consumption?</p><ul><li><b>A.</b> exp(3.00), about 20.1 cubic metres</li><li><b>B.</b> exp(3.30), about 27.1 cubic metres</li><li><b>C.</b> 3.00 cubic metres</li><li><b>D.</b> exp(3.045), about 21.0 cubic metres</li></ul></li>
<li><p>A spline fit on 40,000 bills gives a 95% band of 37.3 to 38.4 cubic metres at 40 °C for four-person standard households. A customer of that type disputes a bill of 46 cubic metres. What does the band say about the bill?</p><ul><li><b>A.</b> Nothing direct: the band is for the mean of such households, and single bills spread far wider</li><li><b>B.</b> The bill is almost certainly a meter error, since it lies outside the band</li><li><b>C.</b> The bill should be cut to 38.4 cubic metres</li><li><b>D.</b> The model is wrong, since a real bill falls outside its band</li></ul></li>
<li><p>In log_m3 ~ tariff_band * household_size, the household_size coefficient is 0.096 and tariff_band[T.social]:household_size is -0.022. What is the social band's slope for household size on the log scale?</p><ul><li><b>A.</b> -0.022</li><li><b>B.</b> 0.096</li><li><b>C.</b> 0.074</li><li><b>D.</b> 0.118</li></ul></li>
<li><p>On the log scale, one more person goes with 7.6% more consumption on the social band and 12.1% more on the villa band. In cubic metres a month, the villa effect turns out more than three times the social one. Why?</p><ul><li><b>A.</b> The percentages were computed wrongly</li><li><b>B.</b> The interval for villas is wider</li><li><b>C.</b> Villas have fewer households in the data</li><li><b>D.</b> The same percentage applies to a higher base: villas use far more water to begin with</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Generalised linear models</h2>
<ol>
<li><p>A model of log monthly consumption has a size slope of 0.096 for standard households. Ghaliya asks how many more cubic metres a month go with one more person in standard households. What do you give her?</p><ul><li><b>A.</b> 0.096</li><li><b>B.</b> About 10% more per person</li><li><b>C.</b> The average over standard bills of the m³ difference from one more person: about 2.3 (2.3 to 2.4)</li><li><b>D.</b> exp(0.096) times the median bill</li></ul></li>
<li><p>A planner wants the probability that a new connection request is approved within 10 days, from the request's district, type and completeness. About 4% of incomplete requests are approved in time. Which model do you start from?</p><ul><li><b>A.</b> A logistic model of the approved-in-time flag</li><li><b>B.</b> A linear model of the approved-in-time flag</li><li><b>C.</b> A linear model of the number of days to approval</li><li><b>D.</b> A Poisson model of the approved-in-time flag</li></ul></li>
<li><p>The autopay odds ratio is 0.10. Without autopay, a household's predicted probability of a late bill is 5%. About how much lower is it for the same profile with autopay?</p><ul><li><b>A.</b> 90 percentage points</li><li><b>B.</b> 25 percentage points</li><li><b>C.</b> 10 percentage points</li><li><b>D.</b> About 4.5 percentage points</li></ul></li>
<li><p>A colleague fits leak counts on material and age with a Poisson model and no offset. Segments of asbestos cement happen to be shorter on average. What happens to the asbestos-cement coefficient?</p><ul><li><b>A.</b> Nothing: a Poisson model accounts for length</li><li><b>B.</b> It compares counts, not rates, so short asbestos-cement mains look less leaky than they are</li><li><b>C.</b> Its standard error grows, but the estimate is fine</li><li><b>D.</b> Only predictions change; coefficients are unaffected</li></ul></li>
<li><p>A Poisson model of leak counts has a Pearson dispersion of 2.3. Its rate ratio for asbestos cement is 1.62 with a 95% interval of 1.38 to 1.91. What should Basil expect from a negative binomial refit?</p><ul><li><b>A.</b> A much smaller rate ratio, since the Poisson estimate is inflated</li><li><b>B.</b> The same interval, with a better AIC</li><li><b>C.</b> A similar rate ratio with an interval about one and a half times as wide</li><li><b>D.</b> No answer: counts with overdispersion need a zero-inflated model</li></ul></li>
<li><p>For each district and month, a utility records the number of meter faults and the number of meters installed. Which model fits the question "how does the fault rate differ by meter age?"</p><ul><li><b>A.</b> A linear model of the number of faults</li><li><b>B.</b> A logistic model of whether the district had any fault</li><li><b>C.</b> A Poisson or negative binomial model of faults with log meters as an offset</li><li><b>D.</b> A linear model of faults divided by meters, without weights</li></ul></li>
<li><p>A linear probability model can predict a negative probability for some households even when it fits the average difference well.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>In a logistic model of late payment, the odds ratio for each past late payment is 1.6. A household has a 20% probability of a late bill. About what is the probability for the same household with one more past late payment?</p><ul><li><b>A.</b> 32%</li><li><b>B.</b> 21.6%</li><li><b>C.</b> 36%</li><li><b>D.</b> 29%</li></ul></li>
<li><p>Bills on autopay were late 40 points less often than comparable bills without it, in a logistic model of observational data. Which sentence may go in the collections report?</p><ul><li><b>A.</b> Comparable households on autopay paid late about 40 points less often than those without it</li><li><b>B.</b> Enrolling households in autopay will cut their late payment by 40 points</li><li><b>C.</b> Autopay reduces late payment by 90%, as its odds ratio is 0.1</li><li><b>D.</b> Autopay causes on-time payment for most households</li></ul></li>
<li><p>In a Poisson model of leaks with offset log(kilometre-years), the coefficient of pressure is 0.28. What does exp(0.28) = 1.32 mean?</p><ul><li><b>A.</b> Each extra bar goes with 1.32 more leaks a year on every main</li><li><b>B.</b> Each extra bar goes with 32% more leaks per kilometre-year, other terms equal</li><li><b>C.</b> Each extra bar adds 0.28 leaks per kilometre</li><li><b>D.</b> A main at high pressure is 1.32 kilometres longer on average</li></ul></li>
<li><p>A Poisson model of complaints per district-month has a Pearson dispersion of 4.0. A colleague reports a rate ratio for pressure management of 1.40 with a 95% interval of 1.20 to 1.63. What do you tell them?</p><ul><li><b>A.</b> The interval is about right, since dispersion affects only the fit</li><li><b>B.</b> The estimate is biased upward by a factor of 4</li><li><b>C.</b> Use a linear model instead, because counts with dispersion are not Poisson</li><li><b>D.</b> The interval is too narrow; refit with a negative binomial or scale the errors, which roughly doubles its width on the log scale</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Check and repair</h2>
<ol>
<li><p>A Poisson leak model with offset log(km-years) gives asbestos cement a rate ratio of 1.62; its dispersion is 2.3. What can Basil's note say?</p><ul><li><b>A.</b> Asbestos-cement mains have 1.62 more leaks a year than PVC mains</li><li><b>B.</b> Asbestos cement leaks at about 1.6 times the rate of PVC at equal age and pressure, with an interval wider than the Poisson one</li><li><b>C.</b> Replacing asbestos cement with PVC will cut leaks by 38%</li><li><b>D.</b> Nothing, because the model is overdispersed</li></ul></li>
<li><p>For a logistic model of meter faults, binned residuals against meter age are positive for the youngest and oldest meters and negative in between; 6 of 20 bins sit outside the band. What do you do?</p><ul><li><b>A.</b> Nothing: some bins always fall outside</li><li><b>B.</b> Switch to a Poisson model of faults</li><li><b>C.</b> Use robust standard errors</li><li><b>D.</b> Give age a curved term, such as a spline, and plot the binned residuals again</li></ul></li>
<li><p>In a model of 30 district rates, one district has leverage 0.7 and Cook's distance 1.5. Its data are correct: a new district with unusually high pressure. What goes in the report?</p><ul><li><b>A.</b> Keep it, and report the estimates with and without it, saying the pressure result leans on one district</li><li><b>B.</b> Delete it as an outlier, since its Cook's distance is above 1</li><li><b>C.</b> Keep it and say nothing, since the data are correct</li><li><b>D.</b> Take the log of the leak rate so that it is no longer influential</li></ul></li>
<li><p>A Poisson model of complaints per district-month will be used to staff the call centre for the busiest months. You can simulate 1,000 replicate years from it. Which statistic makes the most useful check?</p><ul><li><b>A.</b> The total number of complaints in the year</li><li><b>B.</b> The mean temperature of the months</li><li><b>C.</b> The largest monthly count in any district</li><li><b>D.</b> The coefficient of temperature</li></ul></li>
<li><p>A logistic model of whether a customer cancels includes "closing letter printed". Its coefficient is 31 with a standard error of 9,000, and the model's AIC is far better than without it. What is the likely explanation?</p><ul><li><b>A.</b> The letter is by far the strongest driver of cancelling</li><li><b>B.</b> The letter is printed only for customers who cancel, so it separates the outcome and must be removed</li><li><b>C.</b> The sample is too small; collect more months</li><li><b>D.</b> Use HC3 standard errors and keep the term</li></ul></li>
<li><p>You plot the raw residuals of a logistic model of late payment against the bill and see two curved bands. What does this tell you about the model?</p><ul><li><b>A.</b> The model needs a quadratic term in the bill</li><li><b>B.</b> Nothing yet: raw residuals of a yes-or-no outcome always form two bands, so bin and average them first</li><li><b>C.</b> The model is overdispersed</li><li><b>D.</b> The bill should be removed from the model</li></ul></li>
<li><p>Binned residuals of a logistic model by fitted probability show 1 of 20 bins outside the band. Against tenure in months, 6 of 20 bins sit outside, all negative for the shortest tenures. What do you conclude?</p><ul><li><b>A.</b> The model fits, since the plot by fitted probability is the standard check</li><li><b>B.</b> The model is fine, since 6 of 20 is within what chance gives</li><li><b>C.</b> Tenure's effect is not straight on the log odds scale; try a curved term for it and check again</li><li><b>D.</b> Remove tenure because its residuals are biased</li></ul></li>
<li><p>In a regression on 30 districts, district A has leverage 0.70 and a small residual; district B has leverage 0.08 and a residual five times larger than any other. Which statement is right?</p><ul><li><b>A.</b> A is unusual in its predictors, B in its outcome; either can move the fit, which Cook's distance measures</li><li><b>B.</b> Only B can be influential, because influence comes from residuals</li><li><b>C.</b> Only A can be influential, because influence comes from leverage</li><li><b>D.</b> Both should be deleted before refitting</li></ul></li>
<li><p>Two districts with very high Cook's distance turn out to have their main lengths keyed in tens of kilometres. A third influential district is a real new development. What is the right repair?</p><ul><li><b>A.</b> Delete all three and report the fit on 27 districts</li><li><b>B.</b> Keep all three as they are, since deleting data is never allowed</li><li><b>C.</b> Correct the two lengths from the source table, keep the new district, and report the fit with and without it</li><li><b>D.</b> Replace the outcome with its logarithm so that none is influential</li></ul></li>
<li><p>You simulate 1,000 replicate years from a Poisson model of leaks per segment and compare them with the observed year. Which comparison can reveal a problem with the model?</p><ul><li><b>A.</b> The total number of leaks</li><li><b>B.</b> The mean of the fitted rates</li><li><b>C.</b> The share of segments with no leak</li><li><b>D.</b> The coefficient of pipe age</li></ul></li>
<li><p>A logistic model gives a flag a coefficient of 25 with a standard error of 5,000. A cross-table shows that every row with the flag has the outcome. The flag is recorded before the outcome and is legitimate. What do you do?</p><ul><li><b>A.</b> Report an odds ratio of exp(25)</li><li><b>B.</b> Use a penalised fit, such as Firth's method or a small ridge penalty, and say so</li><li><b>C.</b> Use HC3 standard errors</li><li><b>D.</b> Remove the rows with the flag</li></ul></li>
<li><p>Switching a linear model from classical to HC3 standard errors changes its coefficients as well as their standard errors.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Grouped data and many predictors</h2>
<ol>
<li><p>A colleague's logistic model of meter faults is ready for review. Which entry would an assessor accept?</p><ul><li><b>A.</b> The residuals looked a bit off, so I added a log term</li><li><b>B.</b> No problems: the model converged without warnings</li><li><b>C.</b> Missing curve: 6 of 20 binned residuals against meter age outside the 2-SE band; with a spline in age, 1 of 20</li><li><b>D.</b> AIC fell by 40, so the model is right</li></ul></li>
<li><p>A model of 50,000 students' scores in 80 schools has two predictors: hours of homework (per student) and a new curriculum (per school). You switch to errors clustered by school. What happens?</p><ul><li><b>A.</b> Both coefficients change, and both intervals widen</li><li><b>B.</b> The curriculum's interval widens far more than homework's, and neither estimate changes</li><li><b>C.</b> Homework's interval widens most, because it has more variation</li><li><b>D.</b> Nothing much: with 50,000 students clustering does not matter</li></ul></li>
<li><p>In a random-intercept model, district A has 50 bills and a raw mean 0.12 above average; district B has 5,000 bills and the same raw mean. What do their estimated levels look like?</p><ul><li><b>A.</b> Both shrink by the same share, as their raw means are equal</li><li><b>B.</b> B shrinks more, because it has more bills to average</li><li><b>C.</b> Neither moves: each district keeps its own mean</li><li><b>D.</b> A moves noticeably towards the average; B stays almost at 0.12</li></ul></li>
<li><p>A lasso with a cross-validated penalty selected 25 of 90 predictors. Over 100 bootstrap samples, 6 are selected every time and 40 are selected between 20% and 80% of the time. What can you say?</p><ul><li><b>A.</b> The 25 selected predictors are the drivers of demand</li><li><b>B.</b> The 6 are a stable core; the others' selection depends on the sample and should not be reported as findings</li><li><b>C.</b> The model is useless and should be dropped</li><li><b>D.</b> Lower the penalty until all 40 are always selected</li></ul></li>
<li><p>Households with a smart meter display used less water than comparable households without one. They asked for the displays themselves. Which sentence fits the report?</p><ul><li><b>A.</b> Installing displays will cut demand across Sahil</li><li><b>B.</b> The display coefficient is −0.07 on the log scale</li><li><b>C.</b> Households with a display used about 7% less than comparable ones (with its interval); they chose it, so this is not the effect of installing one</li><li><b>D.</b> Displays save water</li></ul></li>
<li><p>A model of 60,000 hospital visits in 40 hospitals includes the patient's age and whether the hospital has a new triage system. Which coefficient's standard error is most understated if visits are treated as independent?</p><ul><li><b>A.</b> Patient age, because it varies most</li><li><b>B.</b> The triage system, because it varies only between the 40 hospitals</li><li><b>C.</b> Both equally, because all visits in a hospital are correlated</li><li><b>D.</b> Neither, because 60,000 visits is a large sample</li></ul></li>
<li><p>You refit a consumption model with standard errors clustered by district. The programme coefficient was −0.081 with a naive standard error of 0.003. What do you expect?</p><ul><li><b>A.</b> A coefficient different from −0.081 and a standard error near 0.003</li><li><b>B.</b> The same coefficient and the same standard error, since clustering only matters for small samples</li><li><b>C.</b> The same coefficient, −0.081, with a much larger standard error</li><li><b>D.</b> A smaller coefficient, because clustering removes district effects</li></ul></li>
<li><p>A random-intercept model reports a district SD of 0.08 and a residual SD of 0.30 on the log scale. About what share of the variance lies between districts?</p><ul><li><b>A.</b> 27%</li><li><b>B.</b> 8%</li><li><b>C.</b> About 7%</li><li><b>D.</b> 0.3%</li></ul></li>
<li><p>In a random-intercept model, a district with 30 bills has a raw mean far above average; its estimated level is about two thirds of that distance from the average. A colleague says the model is "hiding a problem district". What do you answer?</p><ul><li><b>A.</b> The colleague is right; use the raw mean for that district</li><li><b>B.</b> The shrinkage reflects how little 30 bills say about the district; its estimate borrows strength from the other districts, and more data would move it back if the difference is real</li><li><b>C.</b> The district should be removed as an outlier</li><li><b>D.</b> The model should use a larger district SD so that nothing shrinks</li></ul></li>
<li><p>Clustered standard errors and a random-intercept model can both give honest uncertainty for a district-level predictor, but only the random-intercept model also estimates each district's level.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>Before fitting a lasso to forecast summer water demand, you see that the export includes household members' health conditions, which the lasso might find predictive. What do you do?</p><ul><li><b>A.</b> Keep the column and let the lasso decide whether it is useful</li><li><b>B.</b> Keep it only if cross-validation shows it improves the forecast</li><li><b>C.</b> Remove it before modelling, because the purpose does not justify processing health data</li><li><b>D.</b> Keep it but do not report its coefficient</li></ul></li>
<li><p>Which statement about ridge and lasso with standardised predictors is right?</p><ul><li><b>A.</b> Ridge sets some coefficients to zero; the lasso shrinks all of them</li><li><b>B.</b> The lasso can set coefficients exactly to zero; ridge shrinks them all but keeps every one</li><li><b>C.</b> Both select the true predictors when the penalty is chosen by cross-validation</li><li><b>D.</b> Neither needs the predictors to be standardised</li></ul></li>
<li><p>A lasso selects October consumption in 60% of 100 bootstrap samples. October is correlated at 0.9 with September and November, which are selected 45% and 50% of the time. What should the report say?</p><ul><li><b>A.</b> October consumption is a key driver of demand</li><li><b>B.</b> September and November should be removed so October is always selected</li><li><b>C.</b> The autumn months carry similar information and the lasso picks among them unstably; none is reported as a finding</li><li><b>D.</b> October is significant at the 60% level</li></ul></li>
<li><p>A log-consumption model gives programme districts a coefficient of −0.109 with a 95% interval of −0.167 to −0.051. How should the planning report state it?</p><ul><li><b>A.</b> Programme districts: −0.109 (−0.167 to −0.051)</li><li><b>B.</b> Programme districts used 10.9% less water, which the programme saved</li><li><b>C.</b> Households in programme districts used about 10% less (5% to 15% less) than comparable households elsewhere</li><li><b>D.</b> The programme reduces consumption by 0.109 m³</li></ul></li>
</ol>
</section>
<section>
<h2>Capstone: Capstone project presentations</h2>
<ol>
<li><p>In a capstone defence the assessor removes the household-size-by-band interaction from a log-consumption model. Before re-running, what should you predict for the average effect of an extra person?</p><ul><li><b>A.</b> Every band gets the same percentage effect, so the villa effect in m³ shrinks and the social effect grows towards the average</li><li><b>B.</b> Nothing changes, since an interaction only affects the standard errors</li><li><b>C.</b> All effects become zero, because the interaction carried the size effect</li><li><b>D.</b> The model can no longer be fitted</li></ul></li>
<li><p>For brief C1, complaints per district-month, a participant fits a Poisson model without an offset. Customers per district range from 40 to 9,000. What does the assessor expect them to fix first?</p><ul><li><b>A.</b> Add log(customers) as an offset so the model describes complaints per customer</li><li><b>B.</b> Switch to a linear model of complaints</li><li><b>C.</b> Drop the smallest districts</li><li><b>D.</b> Use HC3 standard errors</li></ul></li>
<li><p>For brief C2, where the channel of the offer was chosen at random, which statement can the report make?</p><ul><li><b>A.</b> Text messages are associated with uptake, but nothing causal can be said from data</li><li><b>B.</b> Sending a text message instead of a letter changed the share taking the kit by the estimated difference, with its interval</li><li><b>C.</b> Text messages work better for every household</li><li><b>D.</b> The difference is causal only if the model includes every household characteristic</li></ul></li>
<li><p>A capstone repository whose notebook gives the README's numbers only on the participant's own laptop meets the reproducibility criterion.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
